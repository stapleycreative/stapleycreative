name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Match Vercel's build environment so failures surface here first,
      # not at deploy time.
      NODE_ENV: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Install with --include=dev because npm strips devDeps when
      # NODE_ENV=production. We still want TS types etc. available for
      # the build step. Anything the build actually *needs* at runtime
      # must live in "dependencies" — that's what Vercel installs.
      - run: npm ci --include=dev

      - run: npm run build
